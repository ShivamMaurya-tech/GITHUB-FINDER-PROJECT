<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="githubstructure.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>


    <header>
        <div class="container">
            <h1>GitHub Finder Project</h1>
        </div>
    </header>

<div class="searchbar">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" class="searchinput" placeholder="Search username...">
    <button class="searchbtn">Search</button>
</div>




  

<section class="main-content">
    <div class="container">

<div class="imgtext">
    <div class="photo"></div>
    <div class="name"></div>
</div>

<div class="scorecard">
    <p id="repo">Repositories:</p>
    <p id="followers">Followers:</p>
    <p id="following">Following:</p>
</div>
<div class="content">

    <div class="location">Location:</div>
    <div class="githublink">GitHub Link:</div>
</div>
    </div>

</section>




<script src="githubstructure.js"></script>
</body>
</html>
